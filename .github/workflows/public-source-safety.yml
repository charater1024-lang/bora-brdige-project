name: Public source safety

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-source-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-source-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source without saved credentials
        # actions/checkout v4.2.2, verified against the official release.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Use Node.js 22
        # actions/setup-node v4.4.0, verified against the official release.
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      # No npm install, project lifecycle scripts, deployment or secret access.
      # Use pull_request (never pull_request_target) for untrusted fork code.
      - name: Test the publication guard
        run: node --test tests/public-source-safety.test.mjs

      - name: Test Local LLM token safeguards
        run: python3 -m unittest discover -s tests -p test_local_llm_security.py

      - name: Test read-only production preflight
        run: python3 -m unittest discover -s tests -p test_public_runtime_preflight.py

      - name: Scan committed source and reachable history
        run: |
          node scripts/check-public-source.mjs --ref HEAD
          node scripts/check-public-source.mjs --history --all
